name: Update Sandbox Payment Recovery

on:
  push:
    branches: [fix/storefront-integration-20261019]
    paths: [.github/workflows/update-sandbox-recovery.yml]
  workflow_dispatch:
    inputs:
      order_fingerprint:
        description: "SHA-256 of the exact authorized sandbox order reference"
        type: string
        required: true
      session_fingerprint:
        description: "SHA-256 of the canonical sandbox session ID"
        type: string
        required: true
      event_fingerprint:
        description: "SHA-256 of the canonical sandbox event ID"
        type: string
        required: true
      intent_fingerprint:
        description: "SHA-256 of the canonical sandbox intent ID"
        type: string
        required: true
      expected_checkout_source:
        description: "Exact currently installed checkout patch commit"
        type: string
        required: true
        default: "1b23ed5cd2396d6e5c3b7802943b29a13ab95cd5"
      acknowledge_recovery_patch:
        description: "Update six reviewed sandbox checkout/engraving files; preserve private records"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
concurrency:
  group: hostinger-main-website
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.repository == 'Crosby121/MirroriedLED-Public' && github.ref == 'refs/heads/fix/storefront-integration-20261019' && ((github.event_name == 'workflow_dispatch' && inputs.acknowledge_recovery_patch) || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      PUBLIC_HTML: ${{ secrets.HOSTINGER_PUBLIC_HTML }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      ORDER_FINGERPRINT: ${{ inputs.order_fingerprint || '47841d2f978239ea36e4af4ad55468ad8f72967a95606b6271b098436b21be71' }}
      SESSION_FINGERPRINT: ${{ inputs.session_fingerprint || '5b93ce650d292a2cd513b01b47d84de0da711b9c373a60831152d109ceed1551' }}
      EVENT_FINGERPRINT: ${{ inputs.event_fingerprint || 'bd878bd1eab341b33f5e50013f3b87bb9fe2523c008bfac831d5304f2378d161' }}
      INTENT_FINGERPRINT: ${{ inputs.intent_fingerprint || '701fba92abe38c5de6a2eb6e905c24efdf463d2044df516f06b6e4fac90b11f7' }}
      EXPECTED_CHECKOUT_SOURCE: ${{ inputs.expected_checkout_source || '1b23ed5cd2396d6e5c3b7802943b29a13ab95cd5' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test payment recovery and private deployment boundaries
        run: |
          php -m | grep -q pdo_sqlite
          php -l customer-portal/backend/commerce.php
          php -l customer-portal/backend/business.php
          php -l deploy/hostinger/verify-sandbox-engraving.php
          node --check customer-portal/business.js
          node --check shop/shop.js
          python3 -m unittest discover -s tests -q
          python3 tools/ai_workflow.py validate
          python3 - <<'PYVALIDATE'
          import os, re
          if any(not re.fullmatch(r'[a-f0-9]{64}', os.environ[name + '_FINGERPRINT']) for name in ('ORDER','SESSION','EVENT','INTENT')):
              raise SystemExit('Exact canonical record fingerprints required')
          if not re.fullmatch(r'[a-f0-9]{40}', os.environ['EXPECTED_CHECKOUT_SOURCE']):
              raise SystemExit('Exact installed checkout source required')
          PYVALIDATE
      - name: Prepare the existing key for a read-only login check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          profile = json.loads(Path('deploy/hostinger/main-website.json').read_text())
          assert profile['domain'] == 'mirroriedled.com'
          values = {name: os.environ.get(name) or str(profile[field]) for name, field in {
              'SSH_HOST': 'ssh_host', 'SSH_PORT': 'ssh_port', 'SSH_USER': 'ssh_user',
              'PUBLIC_HTML': 'public_html', 'REMOTE_PYTHON': 'python_executable'}.items()}
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]*', values['SSH_HOST'])
          assert values['SSH_PORT'].isdigit() and 1 <= int(values['SSH_PORT']) <= 65535
          assert re.fullmatch(r'u[0-9]+', values['SSH_USER'])
          assert values['PUBLIC_HTML'] == '/home/' + values['SSH_USER'] + '/domains/mirroriedled.com/public_html'
          assert values['REMOTE_PYTHON'] in {'python3', '/opt/alt/python311/bin/python3', '/opt/alt/python38/bin/python3'}
          key = os.environ.get('SSH_PRIVATE_KEY', '').lstrip('\ufeff').replace('\r', '').strip()
          if '\\n' in key and '\n' not in key:
              key = key.replace('\\n', '\n')
          hosts = os.environ.get('SSH_KNOWN_HOSTS', '').replace('\r', '').strip()
          if not key or not hosts:
              raise SystemExit('Main-site private key or trusted host setting is unavailable')
          folder = Path(os.environ['RUNNER_TEMP']) / 'mled-readonly-auth'
          folder.mkdir(mode=0o700)
          for name, value in [('key', key), ('known_hosts', hosts)]:
              target = folder / name
              target.touch(mode=0o600)
              target.write_text(value + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, value in values.items():
                  output.write(name + '=' + value + '\n')
          PY
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/mled-readonly-auth/key" > "$RUNNER_TEMP/mled-readonly-auth/public"
          echo 'Deployment key public fingerprint:'
          ssh-keygen -lf "$RUNNER_TEMP/mled-readonly-auth/public" -E sha256 | awk '{print $1, $2, $NF}'
      - name: Preflight restricted-key expansion and patch only isolated recovery files
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SANDBOX_STAGE="${PUBLIC_HTML%/public_html}/.mled-checkout-setup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SSH_OPTIONS=(-i "$RUNNER_TEMP/mled-readonly-auth/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o "UserKnownHostsFile=$RUNNER_TEMP/mled-readonly-auth/known_hosts")
          ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "'$REMOTE_PYTHON' - '$PUBLIC_HTML' '$REMOTE_SANDBOX_STAGE'" <<'TRANSPORT'
          import os, stat, sys
          from pathlib import Path
          root, stage = map(Path, sys.argv[1:])
          for path in (root, *root.parents, stage):
              if path.is_symlink():
                  raise SystemExit('Unsafe transport ancestor')
          for path in (root, root.parent):
              info = path.stat()
              if info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) & 0o022:
                  raise SystemExit('Unsafe transport parent ownership or permissions')
          if stage.parent != root.parent:
              raise SystemExit('Invalid transport location')
          stage.mkdir(mode=0o700)
          TRANSPORT
          # Arm cleanup only after this run exclusively created its private transport.
          printf 'REMOTE_SANDBOX_STAGE=%s\n' "$REMOTE_SANDBOX_STAGE" >> "$GITHUB_ENV"
          scp "${SSH_OPTIONS[@]}" -P "$SSH_PORT" deploy/hostinger/update-sandbox-recovery.py customer-portal/backend/commerce.php customer-portal/backend/business.php customer-portal/business.js customer-portal/operations.html shop/shop.js shop/index.html deploy/hostinger/verify-sandbox-engraving.php deploy/hostinger/verify-sandbox-payment.py deploy/hostinger/enable-sandbox-checkout.py deploy/hostinger/checkout-sandbox.py deploy/hostinger/website-release.py deploy/hostinger/setup-customer-accounts.py "$SSH_USER@$SSH_HOST:$REMOTE_SANDBOX_STAGE/"
          before="$(ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "sha256sum '$PUBLIC_HTML/index.html' '${PUBLIC_HTML%/public_html}/mirroriedled-private/customer-portal/config.php'")"
          ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "'$REMOTE_PYTHON' '$REMOTE_SANDBOX_STAGE/update-sandbox-recovery.py' --webroot '$PUBLIC_HTML' --folder '$REMOTE_SANDBOX_STAGE' --source '$GITHUB_SHA' --expected-source '$EXPECTED_CHECKOUT_SOURCE' --order-fingerprint '$ORDER_FINGERPRINT'" > "$RUNNER_TEMP/recovery-receipt.json"
          python3 - <<'RECEIPT'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'recovery-receipt.json').read_text())
          assert data['sandbox_recovery_patch_installed'] is True
          assert data['restricted_key_expanded_intent_read_verified'] is True
          assert data['paid_test_record_preserved'] is True
          print('MLED_SANDBOX_RECOVERY_PATCH_VERIFIED=true')
          print('MLED_RESTRICTED_KEY_EXPANDED_INTENT_READ_VERIFIED=true')
          RECEIPT
          ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "php '$REMOTE_SANDBOX_STAGE/verify-sandbox-engraving.php' '$PUBLIC_HTML' '$ORDER_FINGERPRINT'" > "$RUNNER_TEMP/staged-schema-receipt.json"
          python3 - <<'SCHEMA'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'staged-schema-receipt.json').read_text())
          for name in ('engraving_schema_verified', 'staged_payment_schema_verified', 'legacy_full_payment_preserved', 'existing_private_records_preserved'):
              assert data[name] is True
          assert data['customer_engraving_approval_created'] is False
          assert data['production_payment_activation'] is False
          print('MLED_STAGED_SCHEMA_AND_LEGACY_RECORDS_VERIFIED=true')
          SCHEMA
          ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "'$REMOTE_PYTHON' '$REMOTE_SANDBOX_STAGE/verify-sandbox-payment.py' --webroot '$PUBLIC_HTML' --order-fingerprint '$ORDER_FINGERPRINT' --session-fingerprint '$SESSION_FINGERPRINT' --event-fingerprint '$EVENT_FINGERPRINT' --intent-fingerprint '$INTENT_FINGERPRINT' --replay-known-event"
          after="$(ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "sha256sum '$PUBLIC_HTML/index.html' '${PUBLIC_HTML%/public_html}/mirroriedled-private/customer-portal/config.php'")"
          test "$before" = "$after"
          echo 'MLED_PRODUCTION_HOMEPAGE_AND_CONFIG_PRESERVED=true'
      - name: Verify sandbox configuration and production payments remain off
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.request import build_opener, HTTPRedirectHandler
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          urlopen=build_opener(NoRedirect).open
          with urlopen('https://mirroriedled.com/MLED_checkout_TEST/customer-portal/backend/api.php?action=session', timeout=20) as response:
              data = json.load(response)
              assert data.get('configured') is True
              assert data.get('capabilities', {}).get('payments') is True
              assert response.headers.get('X-MLED-Sandbox-Source') == 'f1e869cd00bef0934090a61713982c6eaee504a1'
              assert response.headers.get('X-MLED-Checkout-Source') == os.environ['GITHUB_SHA']
              assert response.headers.get('X-MLED-Business-Source') == os.environ['GITHUB_SHA']
              assert '/MLED_checkout_TEST/customer-portal/' in response.headers.get('Set-Cookie', '')
          with urlopen('https://mirroriedled.com/customer-portal/backend/api.php?action=session', timeout=20) as response:
              assert json.load(response).get('capabilities', {}).get('payments') is False
          receipt=json.loads((Path(os.environ['RUNNER_TEMP'])/'recovery-receipt.json').read_text())
          for name in ('shop/shop.js','shop/index.html','customer-portal/business.js','customer-portal/operations.html'):
              with urlopen('https://mirroriedled.com/MLED_checkout_TEST/'+name,timeout=20) as response:
                  assert hashlib.sha256(response.read()).hexdigest()==receipt['hashes'][name]
          print('MLED_RECOVERY_PUBLIC_ASSETS_VERIFIED=true')
          print('MLED_SANDBOX_PAYMENT_RECORD_VERIFIED=true')
          print('MLED_ACTUAL_PROVIDER_EVENT_PROCESSED=true')
          print('MLED_PRODUCTION_PAYMENT_ACTIVATION=false')
          PYVERIFY
      - name: Remove private transport files
        if: ${{ always() }}
        shell: bash
        run: |
          trap 'rm -f -- "$RUNNER_TEMP/recovery-receipt.json" "$RUNNER_TEMP/staged-schema-receipt.json" "$RUNNER_TEMP/sandbox-credentials.json" "$RUNNER_TEMP/sandbox-receipt.json"; rm -rf -- "$RUNNER_TEMP/mled-readonly-auth"' EXIT
          if [[ -n "${REMOTE_SANDBOX_STAGE:-}" && -f "$RUNNER_TEMP/mled-readonly-auth/key" ]]; then
            SSH_OPTIONS=(-i "$RUNNER_TEMP/mled-readonly-auth/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o "UserKnownHostsFile=$RUNNER_TEMP/mled-readonly-auth/known_hosts")
            ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "'$REMOTE_PYTHON' - '$REMOTE_SANDBOX_STAGE'" <<'CLEANUP'
          import os, re, stat, sys
          from pathlib import Path
          stage = Path(sys.argv[1])
          if not re.fullmatch(r'\.mled-checkout-setup-[0-9]+-[0-9]+', stage.name):
              raise SystemExit('Invalid cleanup location')
          for path in (stage, *stage.parents):
              if path.is_symlink():
                  raise SystemExit('Unsafe cleanup ancestor')
          info = stage.stat()
          if not stage.is_dir() or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) & 0o077:
              raise SystemExit('Unsafe cleanup ownership or permissions')
          for name in ('update-sandbox-recovery.py', 'verify-sandbox-engraving.php', 'business.php', 'business.js', 'operations.html', 'commerce.php', 'shop.js', 'index.html', 'verify-sandbox-payment.py', 'enable-sandbox-checkout.py', 'sandbox-credentials.json', 'sandbox-website.zip', 'config.example.php', 'checkout-sandbox.py', 'website-release.py', 'setup-customer-accounts.py'):
              (stage / name).unlink(missing_ok=True)
          cache = stage / '__pycache__'
          if cache.exists():
              if cache.is_symlink() or not cache.is_dir():
                  raise SystemExit('Unsafe cleanup cache')
              for path in cache.iterdir():
                  if path.is_symlink() or not path.is_file() or path.suffix != '.pyc':
                      raise SystemExit('Unexpected cleanup file')
                  path.unlink()
              cache.rmdir()
          stage.rmdir()
          CLEANUP
          fi
