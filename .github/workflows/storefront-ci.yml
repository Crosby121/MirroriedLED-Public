name: Storefront CI

on:
  push:
    branches:
      - storefront-vnext
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 60 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck=''

      - name: Test staging deployment boundaries
        run: |
          bash -n deploy/hostinger/staging-release.sh
          python3 -m unittest discover -s tests -p 'test_*release.py' -v

      - name: Verify required storefront files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s repair.js

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check repair.js

      - name: Verify required public sections
        run: |
          grep -q 'id="products"' index.html
          grep -q 'id="custom"' index.html
          grep -q 'id="advertising"' index.html
          grep -q 'id="sponsors"' index.html
          grep -q 'id="events"' index.html
          grep -q 'id="portals"' index.html
          grep -q 'id="contact"' index.html

      - name: Verify Sponsor Portal integration
        run: |
          grep -q 'https://sponsors.mirroriedled.com/' index.html
          grep -q 'Advertising on the Go' index.html
          grep -q 'Sponsor Partner Program' index.html

      - name: Verify brand spelling in staged site
        run: |
          grep -q 'Mirroried LED' index.html
          if grep -q 'Mirrored LED' index.html; then
            echo 'Unexpected Mirrored LED spelling found in index.html'
            exit 1
          fi

      - name: Verify staged storefront has no embedded secrets
        run: |
          if grep -Eqi '(HOSTINGER_API_KEY|PORTAL_POSTGRES_PASSWORD|PORTAL_ADMIN_PASSWORD|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' index.html styles.css app.js; then
            echo 'Potential production secret marker found in storefront files'
            exit 1
          fi
