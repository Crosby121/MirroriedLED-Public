name: Deploy Storefront to Staging

on:
  workflow_dispatch:
    inputs:
      staging_path:
        description: "Absolute staging path; must end with /public_html/MLED_v5_TEST"
        required: true
        type: string
      staging_url:
        description: "Optional staging URL to verify after upload"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: staging-storefront
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Checkout approved storefront
        uses: actions/checkout@v5

      - name: Validate storefront
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s repair.js
          node --check app.js
          node --check repair.js
          grep -q 'id="products"' index.html
          grep -q 'id="custom"' index.html
          grep -q 'id="advertising"' index.html
          grep -q 'id="sponsors"' index.html
          grep -q 'id="events"' index.html
          grep -q 'id="portals"' index.html
          grep -q 'id="contact"' index.html
          grep -q 'https://sponsors.mirroriedled.com/' index.html
          grep -q 'Advertising on the Go' index.html
          grep -q 'Sponsor Partner Program' index.html
          grep -q 'Mirroried LED' index.html
          if grep -q 'Mirrored LED' index.html; then
            echo 'Unexpected brand spelling in storefront' >&2
            exit 1
          fi
          if grep -Eqi '(HOSTINGER_API_KEY|PORTAL_POSTGRES_PASSWORD|PORTAL_ADMIN_PASSWORD|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' index.html styles.css app.js repair.js; then
            echo 'Potential secret marker in storefront' >&2
            exit 1
          fi

      - name: Guard staging destination
        env:
          STAGING_PATH: ${{ inputs.staging_path }}
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          bash deploy/hostinger/staging-release.sh validate "$STAGING_PATH"
          if [[ -n "$STAGING_URL" && ! "$STAGING_URL" =~ ^https://(www\.)?mirroriedled\.com/MLED_v5_TEST/?$ ]]; then
            echo 'Refusing: URL must point to Mirroried LED staging over HTTPS' >&2
            exit 1
          fi

      - name: Prepare checked storefront bundle
        run: |
          mkdir -p "$RUNNER_TEMP/staging-bundle"
          cp index.html styles.css app.js repair.js "$RUNNER_TEMP/staging-bundle/"
          (cd "$RUNNER_TEMP/staging-bundle" && sha256sum index.html styles.css app.js repair.js > SHA256SUMS.txt)

      - name: Configure deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing STAGING_SSH_PRIVATE_KEY' >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing STAGING_SSH_KNOWN_HOSTS' >&2; exit 1; }
          install -m 700 -d "$RUNNER_TEMP/staging-ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/staging-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/staging-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/staging-ssh/key" >/dev/null 2>&1 || {
            echo 'Staging key is invalid or requires a passphrase' >&2
            exit 1
          }

      - name: Upload storefront to staging only
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_PATH: ${{ inputs.staging_path }}
        run: |
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'Invalid or missing STAGING_SSH_HOST' >&2; exit 1; }
          [[ "$STAGING_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$STAGING_PORT >= 1 && 10#$STAGING_PORT <= 65535 )) || { echo 'Invalid or missing STAGING_SSH_PORT' >&2; exit 1; }
          [[ "$STAGING_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid or missing STAGING_SSH_USER' >&2; exit 1; }
          RELEASE_NAME=".release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SSH_OPTIONS=(-i "$RUNNER_TEMP/staging-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o "UserKnownHostsFile=$RUNNER_TEMP/staging-ssh/known_hosts")
          REMOTE="$STAGING_USER@$STAGING_HOST"
          ssh "${SSH_OPTIONS[@]}" -p "$STAGING_PORT" "$REMOTE" "bash -s -- prepare '$STAGING_PATH' '$RELEASE_NAME'" < deploy/hostinger/staging-release.sh
          BUNDLE="$RUNNER_TEMP/staging-bundle"
          scp "${SSH_OPTIONS[@]}" -P "$STAGING_PORT" "$BUNDLE/index.html" "$BUNDLE/styles.css" "$BUNDLE/app.js" "$BUNDLE/repair.js" "$BUNDLE/SHA256SUMS.txt" "$REMOTE:$STAGING_PATH/$RELEASE_NAME/"
          ssh "${SSH_OPTIONS[@]}" -p "$STAGING_PORT" "$REMOTE" "bash -s -- activate '$STAGING_PATH' '$RELEASE_NAME'" < deploy/hostinger/staging-release.sh

      - name: Verify staging URL
        if: ${{ inputs.staging_url != '' }}
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-staging"
          for asset in index.html styles.css app.js repair.js; do
            code="$(curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/verified-staging/$asset" --write-out '%{http_code}' "${STAGING_URL%/}/$asset")"
            [[ "$code" == 200 ]] || { echo "Staging $asset returned HTTP $code" >&2; exit 1; }
            cmp "$RUNNER_TEMP/staging-bundle/$asset" "$RUNNER_TEMP/verified-staging/$asset"
          done

      - name: Remove deployment credentials
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/staging-ssh/key" "$RUNNER_TEMP/staging-ssh/known_hosts"
