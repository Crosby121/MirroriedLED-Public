name: Package Mirroried LED Storefront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify storefront files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f repair.js
          test -s infinity-mirror.webp
          test -s stadium-model.webp
          test -s led-display.webp
          test -s address-sign.webp
          node --check app.js
          node --check repair.js
          node --check customer-portal/portal.js
          node --check customer-portal/business.js
          php -l customer-portal/backend/business.php
          php -l customer-portal/backend/builder.php
          node --check infinity-builder/builder.js
          node --test tests/infinity-builder.test.cjs

      - name: Verify deployment tools
        run: |
          test -f deploy/hostinger/backup-public-html.sh
          test -f deploy/hostinger/deploy-storefront.sh
          test -f deploy/hostinger/rollback-storefront.sh
          test -f deploy/hostinger/verify-storefront.sh
          test -f deploy/hostinger/README.md
          bash -n deploy/hostinger/backup-public-html.sh
          bash -n deploy/hostinger/deploy-storefront.sh
          bash -n deploy/hostinger/rollback-storefront.sh
          bash -n deploy/hostinger/verify-storefront.sh
          python3 -m py_compile deploy/hostinger/website-release.py deploy/hostinger/verify-website.py

      - name: Build deployment bundle
        run: |
          mkdir -p dist/mirroriedled-website
          python3 deploy/hostinger/package-customer-portal.py --output dist/mirroriedled-website/MirroriedLED_Automated_Business_Website.zip
          cp deploy/hostinger/AUTOMATED_BUSINESS_DEPLOYMENT.md dist/mirroriedled-website/
          cp docs/CUSTOMER_PORTAL_BACKEND.md dist/mirroriedled-website/
          cp deploy/hostinger/GITHUB_WEBSITE_DEPLOYMENT.md dist/mirroriedled-website/
          cd dist/mirroriedled-website
          sha256sum MirroriedLED_Automated_Business_Website.zip > SHA256SUMS.txt
          printf 'Mirroried LED website with customer and team operations\nCommit: %s\nBuilt: %s UTC\nPrivate server setup and staging verification required\n' "${GITHUB_SHA}" "$(date -u +'%Y-%m-%d %H:%M:%S')" > BUILD_INFO.txt

      - name: Upload storefront artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirroriedled-website-${{ github.sha }}
          path: dist/mirroriedled-website/
          if-no-files-found: error
          retention-days: 30
