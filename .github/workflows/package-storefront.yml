name: Package Mirroried LED Storefront

on:
  push:
    branches:
      - storefront-vnext
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify storefront files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          node --check app.js

      - name: Verify deployment tools
        run: |
          test -f deploy/hostinger/backup-public-html.sh
          test -f deploy/hostinger/deploy-storefront.sh
          test -f deploy/hostinger/rollback-storefront.sh
          test -f deploy/hostinger/verify-storefront.sh
          test -f deploy/hostinger/README.md
          bash -n deploy/hostinger/backup-public-html.sh
          bash -n deploy/hostinger/deploy-storefront.sh
          bash -n deploy/hostinger/rollback-storefront.sh
          bash -n deploy/hostinger/verify-storefront.sh

      - name: Build deployment bundle
        run: |
          mkdir -p dist/mirroriedled-storefront
          cp index.html styles.css app.js dist/mirroriedled-storefront/
          cp deploy/HOSTINGER_DEPLOYMENT.md dist/mirroriedled-storefront/
          cp deploy/hostinger/backup-public-html.sh dist/mirroriedled-storefront/
          cp deploy/hostinger/deploy-storefront.sh dist/mirroriedled-storefront/
          cp deploy/hostinger/rollback-storefront.sh dist/mirroriedled-storefront/
          cp deploy/hostinger/verify-storefront.sh dist/mirroriedled-storefront/
          cp deploy/hostinger/README.md dist/mirroriedled-storefront/HOSTINGER_SAFE_DEPLOY.md
          chmod +x dist/mirroriedled-storefront/*.sh
          cd dist/mirroriedled-storefront
          sha256sum index.html styles.css app.js > SHA256SUMS.txt
          printf 'Mirroried LED public storefront\nCommit: %s\nBuilt: %s UTC\nSafety mode: full public_html backup required before deployment\n' "${GITHUB_SHA}" "$(date -u +'%Y-%m-%d %H:%M:%S')" > BUILD_INFO.txt

      - name: Upload storefront artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirroriedled-storefront-${{ github.sha }}
          path: dist/mirroriedled-storefront/
          if-no-files-found: error
          retention-days: 30
