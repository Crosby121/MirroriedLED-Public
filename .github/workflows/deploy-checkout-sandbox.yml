name: Install Isolated Checkout Sandbox

on:
  push:
    branches: [fix/storefront-integration-20261019]
    paths: [.github/workflows/deploy-checkout-sandbox.yml]
  workflow_dispatch:
    inputs:
      acknowledge_isolated_setup:
        description: "Install a new separate sandbox; preserve production and keep checkout disabled"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
concurrency:
  group: hostinger-main-website
  cancel-in-progress: false
jobs:
  install:
    if: ${{ github.repository == 'Crosby121/MirroriedLED-Public' && github.ref == 'refs/heads/fix/storefront-integration-20261019' && (github.event_name == 'push' || inputs.acknowledge_isolated_setup) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      PUBLIC_HTML: ${{ secrets.HOSTINGER_PUBLIC_HTML }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test sandbox isolation and prepare reviewed public bundle
        run: |
          python3 -m unittest discover -s tests -p 'test_checkout_sandbox.py' -q
          python3 deploy/hostinger/package-customer-portal.py --output "$RUNNER_TEMP/sandbox-website.zip"
      - name: Validate sandbox key without printing records or credentials
        env:
          MLED_STRIPE_SANDBOX_KEY: ${{ secrets.MLED_STRIPE_SANDBOX_KEY }}
        run: python3 deploy/hostinger/verify-stripe-sandbox.py
      - name: Prepare the existing key for a read-only login check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          profile = json.loads(Path('deploy/hostinger/main-website.json').read_text())
          assert profile['domain'] == 'mirroriedled.com'
          values = {name: os.environ.get(name) or str(profile[field]) for name, field in {
              'SSH_HOST': 'ssh_host', 'SSH_PORT': 'ssh_port', 'SSH_USER': 'ssh_user',
              'PUBLIC_HTML': 'public_html', 'REMOTE_PYTHON': 'python_executable'}.items()}
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]*', values['SSH_HOST'])
          assert values['SSH_PORT'].isdigit() and 1 <= int(values['SSH_PORT']) <= 65535
          assert re.fullmatch(r'u[0-9]+', values['SSH_USER'])
          assert values['PUBLIC_HTML'] == '/home/' + values['SSH_USER'] + '/domains/mirroriedled.com/public_html'
          assert values['REMOTE_PYTHON'] in {'python3', '/opt/alt/python311/bin/python3', '/opt/alt/python38/bin/python3'}
          key = os.environ.get('SSH_PRIVATE_KEY', '').lstrip('\ufeff').replace('\r', '').strip()
          if '\\n' in key and '\n' not in key:
              key = key.replace('\\n', '\n')
          hosts = os.environ.get('SSH_KNOWN_HOSTS', '').replace('\r', '').strip()
          if not key or not hosts:
              raise SystemExit('Main-site private key or trusted host setting is unavailable')
          folder = Path(os.environ['RUNNER_TEMP']) / 'mled-readonly-auth'
          folder.mkdir(mode=0o700)
          for name, value in [('key', key), ('known_hosts', hosts)]:
              target = folder / name
              target.touch(mode=0o600)
              target.write_text(value + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, value in values.items():
                  output.write(name + '=' + value + '\n')
          PY
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/mled-readonly-auth/key" > "$RUNNER_TEMP/mled-readonly-auth/public"
          echo 'Deployment key public fingerprint:'
          ssh-keygen -lf "$RUNNER_TEMP/mled-readonly-auth/public" -E sha256 | awk '{print $1, $2, $NF}'
      - name: Prepare private credential transport
        env:
          MLED_STRIPE_SANDBOX_KEY: ${{ secrets.MLED_STRIPE_SANDBOX_KEY }}
        shell: bash
        run: |
          python3 - <<'PYSECRET'
          import json, os, re
          from pathlib import Path
          key = os.environ.get('MLED_STRIPE_SANDBOX_KEY', '')
          if not re.fullmatch(r'rk_test_[A-Za-z0-9]+', key):
              raise SystemExit('Restricted sandbox key unavailable')
          target = Path(os.environ['RUNNER_TEMP']) / 'sandbox-credentials.json'
          with target.open('x') as output:
              os.fchmod(output.fileno(), 0o600)
              json.dump({'stripe_secret_key': key}, output)
          PYSECRET
      - name: Install only the isolated sandbox folder and its private configuration
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SANDBOX_STAGE="${PUBLIC_HTML%/public_html}/.mled-checkout-setup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SSH_OPTIONS=(-i "$RUNNER_TEMP/mled-readonly-auth/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o "UserKnownHostsFile=$RUNNER_TEMP/mled-readonly-auth/known_hosts")
          ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "'$REMOTE_PYTHON' - '$PUBLIC_HTML' '$REMOTE_SANDBOX_STAGE'" <<'TRANSPORT'
          import os, stat, sys
          from pathlib import Path
          root, stage = map(Path, sys.argv[1:])
          for path in (root, *root.parents, stage):
              if path.is_symlink():
                  raise SystemExit('Unsafe transport ancestor')
          for path in (root, root.parent):
              info = path.stat()
              if info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) & 0o022:
                  raise SystemExit('Unsafe transport parent ownership or permissions')
          if stage.parent != root.parent:
              raise SystemExit('Invalid transport location')
          stage.mkdir(mode=0o700)
          TRANSPORT
          # Arm cleanup only after this run exclusively created its private transport.
          printf 'REMOTE_SANDBOX_STAGE=%s\n' "$REMOTE_SANDBOX_STAGE" >> "$GITHUB_ENV"
          scp "${SSH_OPTIONS[@]}" -P "$SSH_PORT" deploy/hostinger/checkout-sandbox.py deploy/hostinger/website-release.py deploy/hostinger/setup-customer-accounts.py customer-portal/backend/config.example.php "$RUNNER_TEMP/sandbox-website.zip" "$RUNNER_TEMP/sandbox-credentials.json" "$SSH_USER@$SSH_HOST:$REMOTE_SANDBOX_STAGE/"
          ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -s -- '$PUBLIC_HTML' '$REMOTE_SANDBOX_STAGE' '$REMOTE_PYTHON' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          before="$(sha256sum "$1/index.html" | cut -d' ' -f1)"
          "$3" "$2/checkout-sandbox.py" --webroot "$1" --archive "$2/sandbox-website.zip" --credentials "$2/sandbox-credentials.json" --template "$2/config.example.php" --source "$4"
          after="$(sha256sum "$1/index.html" | cut -d' ' -f1)"
          test "$before" = "$after"
          echo 'MLED_PRODUCTION_HOMEPAGE_PRESERVED=true'
          REMOTE
          scp "${SSH_OPTIONS[@]}" -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:${PUBLIC_HTML%/public_html}/mirroriedled-private/checkout-sandbox/receipt.json" "$RUNNER_TEMP/sandbox-receipt.json"
      - name: Verify exact sandbox public files and isolated runtime over HTTPS
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          from concurrent.futures import ThreadPoolExecutor
          import hashlib, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          base = 'https://mirroriedled.com/MLED_checkout_TEST/'
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'sandbox-receipt.json').read_text())
          def verify(item):
              name, expected = item
              if name.endswith(('.php', '.htaccess', '.user.ini')):
                  return
              with urlopen(base + name, timeout=30) as response:
                  if hashlib.sha256(response.read()).hexdigest() != expected:
                      raise RuntimeError('Sandbox public checksum mismatch: ' + name)
          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(verify, receipt['public_hashes'].items()))
          api = base + 'customer-portal/backend/api.php'
          with urlopen(api + '?action=session', timeout=20) as response:
              data = json.load(response)
              assert response.headers.get('X-MLED-Sandbox-Source') == os.environ['GITHUB_SHA']
              assert data.get('configured') is True
              assert data.get('capabilities', {}).get('business') is True
              assert data.get('capabilities', {}).get('payments') is False
              assert '/MLED_checkout_TEST/customer-portal/' in response.headers.get('Set-Cookie', '')
          for name in ('portal.php', 'commerce.php', 'config.php'):
              try:
                  urlopen(base + 'customer-portal/backend/' + name, timeout=20)
              except HTTPError as error:
                  assert error.code in (403, 404)
              else:
                  raise RuntimeError('Sandbox internal source is not protected')
          print('MLED_SANDBOX_EXACT_PUBLIC_FILES_VERIFIED=true')
          print('MLED_SANDBOX_ACCOUNTS_CONFIGURED=true')
          print('MLED_SANDBOX_CHECKOUT_ENABLED=false')
          print('MLED_PRODUCTION_PAYMENT_ACTIVATION=false')
          PYVERIFY
      - name: Remove private transport files
        if: ${{ always() }}
        shell: bash
        run: |
          trap 'rm -f -- "$RUNNER_TEMP/sandbox-credentials.json" "$RUNNER_TEMP/sandbox-receipt.json"; rm -rf -- "$RUNNER_TEMP/mled-readonly-auth"' EXIT
          if [[ -n "${REMOTE_SANDBOX_STAGE:-}" && -f "$RUNNER_TEMP/mled-readonly-auth/key" ]]; then
            SSH_OPTIONS=(-i "$RUNNER_TEMP/mled-readonly-auth/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o "UserKnownHostsFile=$RUNNER_TEMP/mled-readonly-auth/known_hosts")
            ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "'$REMOTE_PYTHON' - '$REMOTE_SANDBOX_STAGE'" <<'CLEANUP'
          import os, re, stat, sys
          from pathlib import Path
          stage = Path(sys.argv[1])
          if not re.fullmatch(r'\.mled-checkout-setup-[0-9]+-[0-9]+', stage.name):
              raise SystemExit('Invalid cleanup location')
          for path in (stage, *stage.parents):
              if path.is_symlink():
                  raise SystemExit('Unsafe cleanup ancestor')
          info = stage.stat()
          if not stage.is_dir() or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) & 0o077:
              raise SystemExit('Unsafe cleanup ownership or permissions')
          for name in ('sandbox-credentials.json', 'sandbox-website.zip', 'config.example.php', 'checkout-sandbox.py', 'website-release.py', 'setup-customer-accounts.py'):
              (stage / name).unlink(missing_ok=True)
          cache = stage / '__pycache__'
          if cache.exists():
              if cache.is_symlink() or not cache.is_dir():
                  raise SystemExit('Unsafe cleanup cache')
              for path in cache.iterdir():
                  if path.is_symlink() or not path.is_file() or path.suffix != '.pyc':
                      raise SystemExit('Unexpected cleanup file')
                  path.unlink()
              cache.rmdir()
          stage.rmdir()
          CLEANUP
          fi
